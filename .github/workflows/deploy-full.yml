name: Deploy API + React (single URL)

on:
  push:
    branches: [ "yedek" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repo
        uses: actions/checkout@v4

      - name: Checkout Frontend repo
        uses: actions/checkout@v4
        with:
          repository: 48pinaribs/NaturalShop.React
          path: frontend
          # Frontend repo private ise aç:
          # token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # React build -> API projesinin içine (NaturalShop.API\NaturalShop.API)
      - name: Copy React build into API project (ClientAppBuild)
        run: |
          rm -rf "./NaturalShop.API/NaturalShop.API/ClientAppBuild"
          mkdir -p "./NaturalShop.API/NaturalShop.API/ClientAppBuild"
          cp -R "./frontend/build/"* "./NaturalShop.API/NaturalShop.API/ClientAppBuild/"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore + Publish: doğru klasördeki csproj
      - name: Restore
        run: dotnet restore "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj"

      - name: Publish API
        run: dotnet publish "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj" -c Release -o publish

      # publish içine ClientAppBuild'i de dahil et
      - name: Copy ClientAppBuild into publish output
        run: |
          rm -rf "./publish/ClientAppBuild"
          mkdir -p "./publish/ClientAppBuild"
          cp -R "./NaturalShop.API/NaturalShop.API/ClientAppBuild/"* "./publish/ClientAppBuild/"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: koydensofraya
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
