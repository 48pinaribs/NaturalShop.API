name: Deploy API + React (single URL)

on:
  push:
    branches: [ "yedek" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repo
        uses: actions/checkout@v4

      - name: Checkout Frontend repo
        uses: actions/checkout@v4
        with:
          repository: 48pinaribs/NaturalShop.React
          path: frontend
          # Frontend private ise:
          # token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Debug - show React build output
        run: |
          echo "=== frontend/build ==="
          ls -la frontend/build
          echo "=== frontend/build/index.html ==="
          ls -la frontend/build/index.html

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj"

      - name: Publish API
        run: dotnet publish "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj" -c Release -o publish

      # React build'i publish içine koy (tek URL için kritik)
      - name: Copy React build into publish/ClientAppBuild
        run: |
          rm -rf "./publish/ClientAppBuild"
          mkdir -p "./publish/ClientAppBuild"
          cp -R "frontend/build/"* "./publish/ClientAppBuild/"

      - name: Debug - verify publish contains ClientAppBuild/index.html
        run: |
          echo "=== publish root ==="
          ls -la publish
          echo "=== publish/ClientAppBuild ==="
          ls -la publish/ClientAppBuild
          echo "=== publish/ClientAppBuild/index.html ==="
          ls -la publish/ClientAppBuild/index.html

      - name: Zip publish folder
        run: |
          cd publish
          zip -r ../site.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: koydensofraya
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./site.zip
