name: Deploy API + React (single URL)

on:
  push:
    branches: [ "yedek" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repo
        uses: actions/checkout@v4

      - name: Checkout Frontend repo
        uses: actions/checkout@v4
        with:
          repository: 48pinaribs/NaturalShop.React
          path: frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Debug - ensure React index exists
        run: |
          ls -la frontend/build
          test -f frontend/build/index.html

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj"

      - name: Publish API
        run: dotnet publish "./NaturalShop.API/NaturalShop.API/NaturalShop.API.csproj" -c Release -o publish

      # React build -> publish/wwwroot (kritik)
      - name: Copy React build into publish/wwwroot
        run: |
          rm -rf "./publish/wwwroot"
          mkdir -p "./publish/wwwroot"
          cp -R "frontend/build/"* "./publish/wwwroot/"

      - name: Debug - verify publish contains wwwroot/index.html
        run: |
          ls -la publish
          ls -la publish/wwwroot
          test -f publish/wwwroot/index.html

      - name: Zip publish folder
        run: |
          cd publish
          zip -r ../site.zip .

      - name: Debug - verify zip contains index.html
        run: |
          unzip -l site.zip | grep "wwwroot/index.html"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: koydensofraya
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./site.zip
